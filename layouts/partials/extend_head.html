<!-- Google Search Console -->
<meta name="google-site-verification" content="-yPK0fFI_w3PEBg912o6vtYuSzGD0xp4thd9qmUeH_0" />

<!-- Open Graph / SEO -->
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="{{ .Site.Title }}" />
<meta property="og:locale" content="ko_KR" />
{{ with .Date }}<meta property="article:published_time" content="{{ .Format "2006-01-02T15:04:05Z07:00" }}" />{{ end }}
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ .Title }}" />
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}" />

<!-- References styling -->
<style>
  .post-content p:has(span[id^="ref-"]) {
    padding-left: 2.2em;
    text-indent: -2.2em;
    font-size: 0.9em;
    line-height: 1.7;
    margin-bottom: 0.4em;
  }
</style>

<!-- KaTeX for math rendering -->
{{ if or .Params.math (and .Site.Params.math (ne .Params.math false)) }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
        ]
    });">
</script>
{{ end }}

<!-- Mermaid for diagrams -->
{{ if or .Params.mermaid (and .Site.Params.mermaid (ne .Params.mermaid false)) }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const isDark = document.body.className.includes("dark");
        mermaid.initialize({
            startOnLoad: true,
            securityLevel: "loose",
            theme: isDark ? "dark" : "neutral",
            themeVariables: isDark ? { primaryColor: "#3b82f6", lineColor: "#6b7280" } : {}
        });
    });
</script>
{{ end }}
